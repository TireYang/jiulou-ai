<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>云膳智脑 · 餐饮酒楼AI数字化中台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0b1322 0%,#1f2d4d 60%,#3a2f10 130%);color:#fff;padding:40px 20px}
  .box{max-width:860px;width:100%;text-align:center}
  .kick{color:#e6c659;font-size:13px;letter-spacing:4px;margin-bottom:14px}
  h1{font-size:36px;letter-spacing:3px;margin-bottom:10px}
  h1 em{color:#e6c659;font-style:normal}
  .sub{color:#c9d2e4;font-size:15px;margin-bottom:40px}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
  a.card{display:block;background:rgba(255,255,255,.06);border:1px solid rgba(201,162,39,.4);border-radius:18px;padding:30px 26px;text-decoration:none;color:#fff;transition:.2s;text-align:left;backdrop-filter:blur(4px)}
  a.card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(201,162,39,.25);border-color:#e6c659}
  .card .ic{font-size:32px;margin-bottom:12px}
  .card b{font-size:19px;display:block;margin-bottom:8px;letter-spacing:1px}
  .card p{font-size:13.5px;color:#c9d2e4;line-height:1.7}
  .card .go{color:#e6c659;font-size:13px;margin-top:14px;display:block;font-weight:700}
  .ft{margin-top:40px;font-size:12px;color:#66748f;letter-spacing:1px}
</style>
</head>
<body>
<div class="box">
  <div class="kick">云膳智脑 · 餐饮酒楼 AI 数字化中台</div>
  <h1>给酒楼装上一个 <em>「不睡觉的副总经理」</em></h1>
  <p class="sub">看得见的经营 · 管得住的环节 · 留得下的顾客</p>
  <div class="cards">
    <a class="card" href="demo.html">
      <div class="ic">🎬</div>
      <b>产品交互演示 Demo</b>
      <p>总览价值账本、股东驾驶舱 LIVE、顾客小程序、楼面/厨师长工作台、监督闭环、9 幕故事模式、报价模块清单。</p>
      <span class="go">进入演示 →</span>
    </a>
    <a class="card" href="product-proposal.html">
      <div class="ic">📄</div>
      <b>产品方案评审稿</b>
      <p>项目背景与痛点、总体架构（客如云为基座）、核心功能模块、各角色价值、集成方案、三期实施路线、技术与合规。</p>
      <span class="go">阅读方案 →</span>
    </a>
  </div>
  <div class="ft">演示数据均为样例 · 客如云交易链路全程不被改写</div>
</div>

</html>
